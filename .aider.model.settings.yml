# 로컬 엔드포인트가 둘이라 --openai-api-base(전역) 대신 모델별 api_base 를 쓴다.
#   8090  qwen3-coder-30b-a3b   코딩 튜닝 MoE — 실제 편집(main)
#  18080  qwen38-flash-next     GB10 메인 서비스 — 요약·커밋메시지(weak)
# weak 를 분리하지 않으면 요약 부하가 편집 서버 슬롯과 경합해
# "Summarization failed" 가 발생한다.

- name: openai/qwen3-coder-30b-a3b
  edit_format: diff
  weak_model_name: openai/qwen38-flash-next
  use_repo_map: true
  send_undo_reply: false
  lazy: false
  reminder: user
  examples_as_sys_msg: true
  extra_params:
    api_base: http://127.0.0.1:8090/v1
    max_tokens: 8192
    temperature: 0.0

- name: openai/qwen38-flash-next
  edit_format: whole
  use_repo_map: false
  extra_params:
    api_base: http://127.0.0.1:18080/v1
    max_tokens: 2048
    temperature: 0.0
