<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 폰 홈 화면에 추가(설치)할 때 쓰는 정보. 서비스 워커(/sw.js)는 아무것도 캐시하지 않는다. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070b12" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GIJO LaB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // 설치 창 신호(beforeinstallprompt)는 화면이 그려지기 전에, 또는 허브가 아닌 주소에서 올 수 있다.
      // 여기서 잡아 두고 허브의 「홈 화면에 추가」 단추(src/labs/InstallApp.jsx)가 꺼내 쓴다.
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__labInstallPrompt = e;
      });
      window.addEventListener("appinstalled", function () {
        window.__labInstallPrompt = null;
      });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
    <title>보안·AI 기술을 만드는 GIJO Tour LaB</title>
    <meta name="description" content="보안 제품 공급과 기술지원, 그리고 자체 제품을 만드는 GIJO Tour LaB." />

    <!-- 폰트: 컴포넌트가 아닌 head에서 선로드 (FOUT 방지) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Syncopate:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
