[build]
  command = "npm run build"
  publish = "dist"

# 예전에 이 도메인에서 직접 서빙하던 술게임 파일(559KB)을 제거했다.
# 공유된 링크가 깨지지 않도록 라이브 버전으로 보낸다.
# 이 규칙은 아래 SPA 폴백보다 먼저 와야 한다. Netlify 는 위에서부터 처리한다.
[[redirects]]
  from = "/GIJO_Drink_v3_0_1.html"
  to = "https://gijotour.github.io/gijodrink/"
  status = 301
  force = true

# 보안무쌍 게임을 gijo.co.kr 주소로 연다(플레이 스토어 안드로이드 앱이 이 주소를 띄운다).
# 게임 파일은 Labs 에 두지 않는다 — 공개 저장소 gijotour/secmusou 의 GitHub Pages 를 그대로 받아 넘긴다(status 200 = 대리 전송).
# 앱이 이 도메인의 주인임을 증명하는 /.well-known/assetlinks.json 은 public/ 에 둔다.
# 이 규칙은 아래 SPA 폴백보다 먼저 와야 한다.
# 「/games/secmusou → /games/secmusou/」 넘기기 규칙을 따로 두지 말 것: Netlify 는 끝 빗금 유무를 같은 주소로 보아
# 자기 자신으로 계속 넘기는 고리가 된다(2026-11-24 배포에서 확인). 앱은 끝 빗금이 있는 주소로만 연다.
[[redirects]]
  from = "/games/secmusou/*"
  to = "https://gijotour.github.io/secmusou/:splat"
  status = 200
  force = true

# 같은 게임이 두 주소로 검색에 잡히지 않게 한다(검색 정본은 소개 페이지 /secmusou 와 GitHub Pages).
[[headers]]
  for = "/games/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Gster 는 사내 도구 소개라 검색에 잡히지 않게 한다.
# 화면에서도 meta robots 를 달지만 그건 스크립트가 돈 뒤에야 생긴다. 응답 머리가 먼저 막는다.
[[headers]]
  for = "/gster"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/gster/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
