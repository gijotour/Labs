[build]
  command = "npm run build"
  publish = "dist"

# 예전에 이 도메인에서 직접 서빙하던 술게임 파일(559KB)을 제거했다.
# 공유된 링크가 깨지지 않도록 라이브 버전으로 보낸다.
# 이 규칙은 아래 SPA 폴백보다 먼저 와야 한다. Netlify 는 위에서부터 처리한다.
[[redirects]]
  from = "/GIJO_Drink_v3_0_1.html"
  to = "https://gijotour.github.io/gijodrink/"
  status = 301
  force = true

# Gster 는 사내 도구 소개라 검색에 잡히지 않게 한다.
# 화면에서도 meta robots 를 달지만 그건 스크립트가 돈 뒤에야 생긴다. 응답 머리가 먼저 막는다.
[[headers]]
  for = "/gster"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/gster/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
